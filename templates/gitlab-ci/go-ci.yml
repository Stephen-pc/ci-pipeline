stages:
  - lint
  - test
  - build

variables:
  GO_VERSION: "1.22"

.go_base:
  image: golang:${GO_VERSION}
  cache:
    key:
      files:
        - go.sum
    paths:
      - .go/pkg/mod/
      - .cache/go-build/
  variables:
    GOMODCACHE: "$CI_PROJECT_DIR/.go/pkg/mod"
    GOCACHE: "$CI_PROJECT_DIR/.cache/go-build"
  before_script:
    - go version

lint:
  extends: .go_base
  stage: lint
  image: golangci/golangci-lint:latest
  script:
    - golangci-lint run
  rules:
    - if: $CI_MERGE_REQUEST_IID
    - if: $CI_COMMIT_BRANCH == "main"
    - if: $CI_COMMIT_BRANCH == "develop"

test:
  extends: .go_base
  stage: test
  script:
    - go test -v -race -coverprofile=coverage.out ./...
  coverage: '/total:\s+\(statements\)\s+(\d+\.\d+)%/'
  artifacts:
    when: always
    reports:
      junit: junit.xml
      coverage_report:
        coverage_format: cobertura
        path: cobertura.xml
    paths:
      - coverage.out
    expire_in: 7 days
  rules:
    - if: $CI_MERGE_REQUEST_IID
    - if: $CI_COMMIT_BRANCH == "main"
    - if: $CI_COMMIT_BRANCH == "develop"

build:
  extends: .go_base
  stage: build
  parallel:
    matrix:
      - GOOS: [linux, darwin, windows]
        GOARCH: [amd64, arm64]
  script:
    - go build -o bin/myapp-${GOOS}-${GOARCH} .
  artifacts:
    paths:
      - bin/
    expire_in: 7 days
  rules:
    - if: $CI_COMMIT_BRANCH == "main"
    - if: $CI_COMMIT_TAG
