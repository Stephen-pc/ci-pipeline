stages:
  - lint
  - test
  - build

variables:
  PYTHON_VERSION: "3.12"

.python_base:
  image: python:${PYTHON_VERSION}
  cache:
    key:
      files:
        - requirements.txt
        - pyproject.toml
    paths:
      - .cache/pip/
  before_script:
    - python --version
    - pip install --upgrade pip

lint:
  extends: .python_base
  stage: lint
  script:
    - pip install ruff mypy
    - pip install -r requirements.txt
    - ruff check .
    - mypy . --ignore-missing-imports || true
  rules:
    - if: $CI_MERGE_REQUEST_IID
    - if: $CI_COMMIT_BRANCH == "main"
    - if: $CI_COMMIT_BRANCH == "develop"

test:
  extends: .python_base
  stage: test
  parallel:
    matrix:
      - PYTHON_VERSION: ["3.10", "3.11", "3.12"]
  script:
    - pip install pytest pytest-cov
    - pip install -r requirements.txt
    - pytest --cov=. --cov-report=xml --cov-report=term-missing
  coverage: '/TOTAL\s+\d+\s+\d+\s+(\d+%)/'
  artifacts:
    when: always
    reports:
      junit: junit.xml
      coverage_report:
        coverage_format: cobertura
        path: coverage.xml
    expire_in: 7 days
  rules:
    - if: $CI_MERGE_REQUEST_IID
    - if: $CI_COMMIT_BRANCH == "main"
    - if: $CI_COMMIT_BRANCH == "develop"

build:
  extends: .python_base
  stage: build
  script:
    - pip install build
    - python -m build
  artifacts:
    paths:
      - dist/
    expire_in: 7 days
  rules:
    - if: $CI_COMMIT_BRANCH == "main"
    - if: $CI_COMMIT_TAG
