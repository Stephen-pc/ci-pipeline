stages:
  - lint
  - test
  - build

variables:
  NODE_VERSION: "20"

.node_base:
  image: node:${NODE_VERSION}
  cache:
    key:
      files:
        - package-lock.json
        - yarn.lock
        - pnpm-lock.yaml
    paths:
      - node_modules/
      - .npm/
  before_script:
    - node -v
    - npm -v

lint:
  extends: .node_base
  stage: lint
  script:
    - npm ci --cache .npm
    - npm run lint --if-present
  rules:
    - if: $CI_MERGE_REQUEST_IID
    - if: $CI_COMMIT_BRANCH == "main"
    - if: $CI_COMMIT_BRANCH == "develop"

test:
  extends: .node_base
  stage: test
  parallel:
    matrix:
      - NODE_VERSION: ["18", "20", "22"]
  script:
    - npm ci --cache .npm
    - npm test
  coverage: '/All files\s*\|\s*([\d.]+)/'
  artifacts:
    when: always
    reports:
      junit: junit.xml
      coverage_report:
        coverage_format: cobertura
        path: coverage/cobertura-coverage.xml
    paths:
      - coverage/
    expire_in: 7 days
  rules:
    - if: $CI_MERGE_REQUEST_IID
    - if: $CI_COMMIT_BRANCH == "main"
    - if: $CI_COMMIT_BRANCH == "develop"

build:
  extends: .node_base
  stage: build
  script:
    - npm ci --cache .npm
    - npm run build --if-present
  artifacts:
    paths:
      - dist/
    expire_in: 7 days
  rules:
    - if: $CI_COMMIT_BRANCH == "main"
    - if: $CI_COMMIT_TAG
